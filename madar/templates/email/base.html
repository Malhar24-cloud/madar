<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#F2F5F3;font-family:Tahoma,Arial,sans-serif;color:#13222A">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F5F3;padding:24px 12px"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #D6DFDA">
<tr><td style="padding:18px 24px;border-bottom:3px solid #0D6A61;font-size:16px;font-weight:bold;color:#0D6A61">مدار · {{ company }}</td></tr>
<tr><td dir="rtl" style="padding:22px 24px;font-size:15px;line-height:1.9;white-space:pre-line;text-align:right">{{ email.body }}</td></tr>
{% if email.actions %}<tr><td dir="rtl" style="padding:0 24px 24px;text-align:right">
{% for label, url in email.actions %}<a href="{{ url }}" style="display:inline-block;background:#0D6A61;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:8px;font-weight:bold;margin:4px 0">{{ label }}</a>{% endfor %}
</td></tr>{% endif %}
<tr><td style="padding:14px 24px;border-top:1px solid #E9EFEC;font-size:12px;color:#74858A;text-align:right" dir="rtl">رسالة آلية من نظام مدار للموارد البشرية. لا تشارك روابط هذه الرسالة مع أحد.</td></tr>
</table></td></tr></table></body></html>
