{% extends "base.html" %}{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="topbar"><div><h1>تغيير كلمة المرور</h1><p>بعد التغيير تنتهي كل جلساتك الأخرى على الأجهزة الثانية.</p></div></div>
<form class="panel" method="post" style="display:grid;gap:12px;max-width:460px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if error %}<div class="flash bad">{{ error }}</div>{% endif %}
  <div class="field"><label for="current">كلمة المرور الحالية</label><input class="input" id="current" name="current" type="password" autocomplete="current-password" required></div>
  <div class="field"><label for="password">الجديدة</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required minlength="10"></div>
  <div class="field"><label for="password2">تأكيد الجديدة</label><input class="input" id="password2" name="password2" type="password" autocomplete="new-password" required></div>
  <div><button class="btn primary">حفظ</button></div>
</form>
{% endblock %}
